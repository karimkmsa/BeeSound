<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeSound</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="cart">
        <div class="container cart-container mt-5">
            <div class="cart-header">
                <h1>Cart</h1>
                <a href="index.html" class="back-link">
                    <span class="arrow">&larr;</span> Back To Shopping
                </a>
            </div>

            <div class="cart-content">
                <div class="product-main-img">
                    <img src="images/MQTP3-removebg-preview 1 (2).png" alt="Beats headphones">
                </div>

                <div class="description">
                    <h2>Beats By Dre</h2>

                    <div class="color-options">
                        <span class="color gray" title="Gray"></span>
                        <span class="color black" title="Black"></span>
                        <span class="color navy" title="Navy"></span>
                    </div>

                    <h3 class="product-price">BAM 29.99</h3>

                    <p class="delivery-time">
                        <strong>Deliveri Time:</strong>
                        <span>2 work days</span>
                    </p>
                </div>
            </div>

            <div class="checkout-container">
                <button class="checkout-btn" onclick="location.href='checkout.html'">
                    Checkout
                </button>
            </div>
        </div>

    </section>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
